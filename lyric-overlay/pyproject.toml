[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-overlay"
version = "1.0.0"
description = "Corner lyrics overlay widget for Linux + Wayland (SwayWM): MPRIS/window-title detection + Genius lyrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lyric-overlay" }]
keywords = ["wayland", "sway", "layer-shell", "lyrics", "genius", "mpris", "widget", "overlay"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: Window Managers",
]
dependencies = [
    "PyGObject>=3.44; python_version<'999'",   # gi/GTK4 — обычно ставится через apt (python3-gi)
    "lyricsgenius>=3.0",                        # поиск текстов через Genius API
    "PyYAML>=6.0",                              # config.yaml
    "requests>=2.28",                           # загрузка обложек/таймкодов
]

[project.optional-dependencies]
mpris = ["dbus-fast>=2.0"]                     # быстрый async D-Bus для MPRIS
dbus-next = ["dbus-next>=0.2.3"]               # альтернатива dbus-fast

[project.scripts]
lyric-overlay = "lyric_overlay.main:main"

[tool.setuptools]
packages = ["lyric_overlay"]

[tool.setuptools.package-data]
lyric_overlay = ["../styles/*.css", "../assets/*.svg"]
